<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Starlight ML – Browser Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      padding: 2rem;
    }

    h1 {
      color: #38bdf8;
    }

    pre {
      background: #020617;
      padding: 1rem;
      border-radius: 8px;
      overflow-x: auto;
      margin-top: 1rem;
    }

    .label {
      color: #22c55e;
      margin-top: 1.2rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>🌟 Starlight ML – Browser Test</h1>

  <div id="output"></div>

  <script type="module">
    import * as ml from 'https://cdn.jsdelivr.net/npm/starlight-ml@1.0.0/starlight-ml.mjs';

    const out = document.getElementById("output");

    function print(label, data) {
      out.innerHTML += `
        <div class="label">${label}</div>
        <pre>${JSON.stringify(data, null, 2)}</pre>
      `;
    }

    const text = "Hello world! This is Starlight ML. Starlight is fast.";

    const tokens = ml.tokenize(text);
    const filtered = ml.removeStopwords(tokens, ["is", "this"]);
    const bow = ml.bagOfWords(text, ["is", "this"]);
    const bigrams = ml.ngrams(filtered, 2);
    const sentences = ml.splitSentences(text);
    const shuffled = ml.shuffle(tokens);
    const normalized = ml.normalize([10, 20, 90, 50]);

    print("Tokens", tokens);
    print("Filtered Tokens", filtered);
    print("Bag of Words", bow);
    print("Bigrams", bigrams);
    print("Sentences", sentences);
    print("Shuffled Tokens", shuffled);
    print("Normalized Values", normalized);

    console.log("Starlight ML loaded successfully ✔");
  </script>

</body>
</html>
